<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Odin | Project: Library</title>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Our Home Library</h1>
        </div>
        <div class="header-bottom">
            <div class="search-container">
                <label for="bookSearch">Search Library: <input type="text" name="search" id="bookSearch" placeholder="Search by Title or Author"></label>
                <button id="searchBtn">Search</button>
            </div>
            <div class="add-container">
                <button id="openModalBtn">Add Book</button>
            </div>
        </div>
    </header>
    <div class="content">
        <div class="card">
            <h2 class="title">Title: On The Road</h2>
            <h3 class="author">Author: Jack Karouac</h3>
            <p class="pages">Pages: 257</p>
            <p class="read">Status: Read</p>
            <button class="delete">Remove</button>
            <button class="change-status">Change Status</button>
        </div>
    </div>
    <dialog id="myDialog">
        <div class="modal-header">
            <h2>Add Book to Library</h2>
            <button id="closeModalBtn">&times</button>
        </div>
        <form action="">
            <div>
                <label for="addTitle">Title: <input type="text" name="title" id="addTtitle"></label>
            </div>
            <div>
                <label for="addAuthor">Author: <input type="text" name="author" id="addAuthor"></label>
            </div>
            <div>
                <label for="addPages">Number of Pages: <input type="number" name="pages" id="addPages"></label>
            </div>
            <div>
                <label for="addStatus">Read Status:</label>
                <select name="read" id="addStatus">
                    <option value="read">Read</option>
                    <option value="not read">Not read</option>
                </select>
            </div>
            <div class="button-row">
                <button id="addBookBtn">Add To Collection</button>
            </div>
        </form>
    </dialog>
    <footer>
        <p>Powered by <a href="#">myNamesDallas</a></p>
    </footer>
</body>
</html>
